name: Pipeline CI - Matrix + Cache

on:
  push:
    branches:
      - main

jobs:

  testes:
    name: Testes - ${{ matrix.os }} - Python ${{ matrix.python-version }}

    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04

        python-version:
          - "3.11"
          - "3.12"

    runs-on: ${{ matrix.os }}

    steps:

      # Baixar o código do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # Configurar Python utilizando Matrix + Cache
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Mostrar as versões utilizadas
      - name: Verificar versões
        run: |
          echo "Sistema operacional:"
          lsb_release -a

          echo "Versão do Python:"
          python --version

          echo "Versão do pip:"
          pip --version

      # Instalar dependências
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Análise de código
      - name: Linter - Flake8
        run: |
          flake8 calculadora.py \
            test_soma.py \
            test_subtracao.py \
            test_multiplicacao.py \
            test_divisao.py

      # Teste de soma
      - name: Teste unitário - Soma
        run: |
          pytest test_soma.py

      # Teste de subtração
      - name: Teste unitário - Subtração
        run: |
          pytest test_subtracao.py

      # Teste de multiplicação
      - name: Teste unitário - Multiplicação
        run: |
          pytest test_multiplicacao.py

      # Teste de divisão
      - name: Teste unitário - Divisão
        run: |
          pytest test_divisao.py

      # Cobertura de testes
      - name: Testes com cobertura
        run: |
          pytest \
            --cov=calculadora \
            --cov-report=term-missing \
            --cov-fail-under=80

      # Análise de segurança
      - name: Análise de segurança - Bandit
        run: |
          bandit -r calculadora.py

      # Verificação de possíveis chaves de API
      - name: Verificar chaves expostas
        run: |
          if grep -R -nE 'API_KEY[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']' . \
            --exclude-dir=.git \
            --exclude=pipeline.yml; then

            echo "ERRO: Chave de API encontrada!"
            exit 1

          else

            echo "Nenhuma chave de API encontrada."

          fi

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}